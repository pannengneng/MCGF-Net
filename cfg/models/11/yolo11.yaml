# Ultralytics YOLO11 object detection model with P3/8 - P5/32 outputs
# Model docs: https://docs.ultralytics.com/models/yolo11
# Task docs: https://docs.ultralytics.com/tasks/detect

# Parameters
nc: 80 # number of classes
scales: # model compound scaling constants, i.e. 'model=yolo11n.yaml' will call yolo11.yaml with scale 'n'
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024] # summary: 181 layers, 2624080 parameters, 2624064 gradients, 6.6 GFLOPs
  s: [0.50, 0.50, 1024] # summary: 181 layers, 9458752 parameters, 9458736 gradients, 21.7 GFLOPs
  m: [0.50, 1.00, 512] # summary: 231 layers, 20114688 parameters, 20114672 gradients, 68.5 GFLOPs
  l: [1.00, 1.00, 512] # summary: 357 layers, 25372160 parameters, 25372144 gradients, 87.6 GFLOPs
  x: [1.00, 1.50, 512] # summary: 357 layers, 56966176 parameters, 56966160 gradients, 196.0 GFLOPs

# YOLO11n backbone
backbone:
  # [from：输入来源, repeats：模块重复次数, module：模块名称, args：模块参数]   输入：3×640×640     卷积：尺寸/2、（通道*2）   C3K2：通道*2
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2    # 0 Conv[64,3,2] （ 3×3 卷积 + 步长 2，下采样 2 倍，提取基础特征 ）   320×320（P1/2）  ×64
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4   # 1 Conv[128,3,2] （ 3×3 卷积 + 步长 2，下采样 2 倍 ）             160×160（P2/4） ×128
  - [-1, 2, C3k2, [256, False, 0.25]]     # 2 C3k2[256,False,0.25]×2  （改进型 CSP 模块（2 次重复），通道扩增到 256，无 shortcut，宽度系数 0.25）  160×160 ×256
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8   # 3 Conv[256,3,2] （3×3 卷积 + 步长 2，下采样 2 倍）                 80×80（P3/8） ×256
  - [-1, 2, C3k2, [512, False, 0.25]]     # 4 C3k2[512,False,0.25]×2 （C3k2 模块（2 次重复），通道扩增到 512）   80×80 ×512
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16  # 5 Conv[512,3,2] （3×3 卷积 + 步长 2，下采样 2 倍）                 40×40（P4/16） ×512
  - [-1, 2, C3k2, [512, True]]            # 6 C3k2[512,True]×2 （C3k2 模块（2 次重复），带 shortcut，通道保持 512）  	40×40 ×512
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32 # 7 Conv[1024,3,2] （3×3 卷积 + 步长 2，下采样 2 倍）                        20×20（P5/32） ×1024
  - [-1, 2, C3k2, [1024, True]]           # 8 C3k2[1024,True]×2  （C3k2 模块（2 次重复），带 shortcut，通道保持 1024）   	20×20 ×1024
  - [-1, 1, SPPF, [1024, 5]] # 9          # 9 SPPF[1024,5]  （空间金字塔池化（5×5 核），增强全局特征提取）                    	20×20 ×1024
  - [-1, 2, C2PSA, [1024]] # 10           # 10 C2PSA[1024]×2  （带 PSA 注意力的 C2 模块（2 次重复），增强特征表达能力）          20×20 ×1024

# YOLO11n head  （含 Neck 特征融合 + Detect 检测头）
head:
  # （1）FPN 自顶向下融合（P5→P4→P3）
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]       # 11 nn.Upsample[None,2,nearest]（最近邻上采样 2 倍，将 P5 特征上采样到 P4）             40×40  ×1024
  - [[-1, 6], 1, Concat, [1]] # cat backbone P4      # 12 Concat[1] （拼接上采样后的 P5 特征（11 层）和 Backbone 的 P4 特征（6 层），通道拼接）   40×40  ×1024+512=1536
  - [-1, 2, C3k2, [512, False]] # 13                 # 13 	C3k2[512,False]×2 （C3k2 模块融合特征，通道压缩到 512）                          40×40  ×512

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]       # 14 nn.Upsample[None,2,nearest] （最近邻上采样 2 倍，将 P4 特征上采样到 P3 尺度）         80×80  ×512
  - [[-1, 4], 1, Concat, [1]] # cat backbone P3      # 15 Concat[1] （拼接上采样后的 P4 特征（14 层）和 Backbone 的 P3 特征（4 层），通道拼接）    80×80  ×512+512=1024
  - [-1, 2, C3k2, [256, False]] # 16 (P3/8-small)    # 16 C3k2[256,False]×2 （C3k2 模块融合特征，通道压缩到 256（P3/8-small 检测分支））        80×80  ×256

# （2）PAN 自底向上融合（P3→P4→P5）
  - [-1, 1, Conv, [256, 3, 2]]                       # 17 Conv[256,3,2] （3×3 卷积 + 步长 2，下采样 2 倍，将 P3 特征下采样到 P4 尺度）         	40×40  ×256
  - [[-1, 13], 1, Concat, [1]] # cat head P4         # 18 Concat[1] （拼接下采样后的 P3 特征（17 层）和 Head 的 P4 特征（13 层），通道拼接）       40×40  ×256+512=768
  - [-1, 2, C3k2, [512, False]] # 19 (P4/16-medium)  # 19 C3k2[512,False]×2 （C3k2 模块融合特征，通道压缩到 512（P4/16-medium 检测分支））       40×40  ×512

  - [-1, 1, Conv, [512, 3, 2]]                       # 20 Conv[512,3,2] （3×3 卷积 + 步长 2，下采样 2 倍，将 P4 特征下采样到 P5 尺度）            20×20  ×512
  - [[-1, 10], 1, Concat, [1]] # cat head P5         # 21 Concat[1] （拼接下采样后的 P4 特征（20 层）和 Backbone 的 P5 特征（10 层），通道拼接）    20×20  ×512+1024=1536
  - [-1, 2, C3k2, [1024, True]] # 22 (P5/32-large)   # 22 C3k2[1024,True]×2 （C3k2 模块融合特征，通道压缩到 1024（P5/32-large 检测分支））        20×20  ×1024

# （3）Detect 检测头
  - [[16, 19, 22], 1, Detect, [nc]] # Detect(P3, P4, P5)  # 23 	Detect[nc=80] （检测头，接收 P3/8、P4/16、P5/32 三个尺度的特征，输出 80 类的边界框 + 类别预测）
